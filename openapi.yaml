openapi: 3.1.0
info:
  title: ManageLM
  description: >
    Manage Linux and Windows servers through the ManageLM portal API: run tasks
    and scans, search the fleet (inventory, security, activity, access,
    certificates, monitors, backups, credentials, keystore, cloud resources)
    and act on cloud VMs. The same features as the ManageLM MCP server, with
    the signed-in user's permissions. 30 operations, the GPT Actions maximum.
  version: 1.0.2
  contact:
    name: ManageLM
    url: https://www.managelm.com

servers:
  # Self-hosted users: replace this URL with your own portal address.
  - url: https://app.managelm.com/api
    description: ManageLM SaaS

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "OAuth access token for the signed-in ManageLM user, or a ManageLM API key (Portal > Settings > MCP & API)"

  schemas:
    Agent:
      type: object
      properties:
        id: { type: string, format: uuid }
        hostname: { type: string }
        display_name: { type: string }
        node_type: { type: string, description: "linux or windows" }
        status: { type: string, description: "online, offline, approved, pending_approval" }
        os_info: { type: string }
        agent_version: { type: string }
        ip_address: { type: string }
        health_metrics:
          type: object
          description: "cpu_percent, memory_percent, disk_percent, load_avg"
        tags: { type: array, items: { type: string } }
        groups:
          type: array
          description: "Group names (searchAgents), or {id, name} objects (getAgent)"
        site: { type: string }
        last_seen_at: { type: string, format: date-time }

    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        skill_slug: { type: string }
        status:
          type: string
          description: "sent, completed, failed, timeout, needs_input, answered"
        summary: { type: string }
        question:
          type: string
          description: Question from the agent when status is needs_input
        error_message: { type: string }
        mutating: { type: boolean }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    TaskOutcome:
      type: object
      description: >
        200: the task finished within wait_seconds ({task, result}).
        202: still running ({task_id, still_running: true}); check it later with getTask.
      properties:
        task: { $ref: "#/components/schemas/Task" }
        result: { description: The task output from the agent }
        task_id: { type: string, format: uuid }
        still_running: { type: boolean }

    Scan:
      type: object
      properties:
        status: { type: string, description: "pending, running, completed, failed" }
        report: { description: "Findings, items or entries, once completed" }
        error_message: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error: { type: string }

paths:
  # ── Servers & account ────────────────────────────────────────────────

  /search/agents:
    get:
      operationId: searchAgents
      summary: Find servers
      description: >
        List and filter servers by status, group, site, health metrics or text.
        Call first to get a server's agent id. Each row includes status, OS, IPs,
        health, groups and site.
      parameters:
        - { name: query, in: query, description: "Free text on hostname, display name, OS, IP or tags", schema: { type: string } }
        - { name: status, in: query, description: "online, offline, approved, pending_approval", schema: { type: string } }
        - { name: group, in: query, description: Group name, schema: { type: string } }
        - { name: site, in: query, description: "Site name (datacenter, office, region)", schema: { type: string } }
        - { name: cpu_above, in: query, description: CPU usage above this percentage, schema: { type: number } }
        - { name: memory_above, in: query, description: Memory usage above this percentage, schema: { type: number } }
        - { name: disk_above, in: query, description: Disk usage above this percentage, schema: { type: number } }
      responses:
        "200":
          description: Matching servers
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents: { type: array, items: { $ref: "#/components/schemas/Agent" } }

  /agents/{agentId}:
    get:
      operationId: getAgent
      summary: Get server details
      description: Detailed information for one server (OS, IPs, health, groups, LLM status). For its skills, use getAgentSkills.
      parameters:
        - { name: agentId, in: path, required: true, description: Agent id from searchAgents, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Server details
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent: { $ref: "#/components/schemas/Agent" }
        "400":
          description: "Not an id: pass the uuid from searchAgents or a task response, not a name"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Server not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /agents/{agentId}/skills:
    get:
      operationId: getAgentSkills
      summary: Skills on a server
      description: >
        Skills assigned to a server, directly or through a group. Use the slug as
        skill_slug in submitTask.
      parameters:
        - { name: agentId, in: path, required: true, description: Agent id from searchAgents, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Assigned skills
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        description: { type: string }
                        via_group: { type: boolean, description: "true when assigned through a group rather than directly" }

  /account:
    get:
      operationId: getAccount
      summary: Account and team members
      description: >
        Account name and enabled features, and the team members with their role,
        permissions (perm_*), system username and whether they registered an SSH key.
      responses:
        "200":
          description: Account and users
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { type: object }
                  users: { type: array, items: { type: object } }

  /groups:
    get:
      operationId: listGroups
      summary: List server groups
      description: Server groups with their servers and assigned skills. Group names are valid group filters.
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { type: object } }

  # ── Search (read-only, queries stored data) ──────────────────────────

  /search/inventory:
    get:
      operationId: searchInventory
      summary: Search inventory
      description: >
        Find which servers run a service, have a package installed or run
        containers, from stored inventory scans. Runs nothing on the servers.
      parameters:
        - { name: query, in: query, description: "Item name, version or details (e.g. nginx, docker)", schema: { type: string } }
        - { name: category, in: query, description: "system, web, database, mail, container, network, storage, security, monitoring, log, user, scheduler, software, other", schema: { type: string } }
        - { name: status, in: query, description: "running, stopped, installed, info", schema: { type: string } }
        - { name: group, in: query, description: Group name, schema: { type: string } }
        - { name: site, in: query, description: Site name, schema: { type: string } }
      responses:
        "200":
          description: Matching items (item_name, item_category, item_status, item_version, per server)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }

  /search/security:
    get:
      operationId: searchSecurity
      summary: Search security issues
      description: >
        Security issues across servers: audit findings, pentest findings and
        threat alerts, each tagged with its source. Unresolved only by default.
      parameters:
        - { name: query, in: query, description: Search titles and explanations, schema: { type: string } }
        - { name: severity, in: query, description: "Minimum severity: critical, high, medium, low", schema: { type: string } }
        - { name: category, in: query, description: 'ssh, firewall, users, permissions, updates, kernel, tls, docker, ... ("Threat Detection" for threats)', schema: { type: string } }
        - { name: source, in: query, description: "audit, pentest, threat, or all (default)", schema: { type: string, enum: [audit, pentest, threat, all] } }
        - { name: unresolved, in: query, description: "Only open items (default true)", schema: { type: boolean } }
        - { name: group, in: query, description: Group name, schema: { type: string } }
        - { name: site, in: query, description: Site name, schema: { type: string } }
        - { name: since, in: query, description: 'ISO-8601 date or datetime (inclusive), e.g. "2026-05-10"', schema: { type: string } }
        - { name: until, in: query, description: ISO-8601 date or datetime (exclusive), schema: { type: string } }
      responses:
        "200":
          description: Findings (severity, category, title, explanation, remediation, source, per server) and counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  findings: { type: array, items: { type: object } }
                  counts: { type: object }

  /search/activity:
    get:
      operationId: searchActivity
      summary: Search user activity
      description: >
        Logins, failed logins, sudo commands and file changes across servers,
        from stored activity scans.
      parameters:
        - { name: query, in: query, description: "Username, command, source IP or file path", schema: { type: string } }
        - { name: category, in: query, description: "sessions, failed_auth, root_commands, file_changes", schema: { type: string } }
        - { name: user, in: query, description: System username or ManageLM user, schema: { type: string } }
        - { name: group, in: query, description: Group name, schema: { type: string } }
        - { name: site, in: query, description: Site name, schema: { type: string } }
        - { name: since, in: query, description: 'ISO-8601 date or datetime (inclusive), e.g. "2026-05-10"', schema: { type: string } }
        - { name: until, in: query, description: ISO-8601 date or datetime (exclusive), schema: { type: string } }
      responses:
        "200":
          description: Activity entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity: { type: array, items: { type: object } }

  /search/ssh-keys:
    get:
      operationId: searchSshKeys
      summary: Search SSH keys
      description: >
        SSH keys deployed on servers and registered in ManageLM profiles, mapped
        to team members. Use "user" to see one person's access.
      parameters:
        - { name: query, in: query, description: Fingerprint or system username, schema: { type: string } }
        - { name: user, in: query, description: 'ManageLM user name or email ("me" for yourself)', schema: { type: string } }
        - { name: unknown_only, in: query, description: Only keys not matched to a ManageLM user, schema: { type: boolean } }
        - { name: group, in: query, description: Group name, schema: { type: string } }
        - { name: site, in: query, description: Site name, schema: { type: string } }
      responses:
        "200":
          description: Registered and deployed keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered_keys: { type: array, items: { type: object } }
                  deployed_keys: { type: array, items: { type: object } }

  /search/sudo-rules:
    get:
      operationId: searchSudoRules
      summary: Search sudo rules
      description: Sudo rules (Linux) and administrator group membership (Windows) across servers.
      parameters:
        - { name: query, in: query, description: System username, schema: { type: string } }
        - { name: user, in: query, description: 'ManageLM user name or email ("me" for yourself)', schema: { type: string } }
        - { name: nopasswd_only, in: query, description: Only NOPASSWD rules, schema: { type: boolean } }
        - { name: group, in: query, description: Group name, schema: { type: string } }
        - { name: site, in: query, description: Site name, schema: { type: string } }
      responses:
        "200":
          description: Rules per server
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules: { type: array, items: { type: object } }

  /search/certs:
    get:
      operationId: searchCertificates
      summary: Search certificates found on servers
      description: >
        x509 certificates discovered on servers by certificate scans: expired,
        expiring, weak, self-signed, unmanaged. For certificates ManageLM issues, use searchPki.
      parameters:
        - { name: query, in: query, description: "Subject, issuer or path", schema: { type: string } }
        - { name: status, in: query, description: "managed, unmanaged, expired, expiring, weak, self_signed", schema: { type: string } }
        - { name: path, in: query, description: Filesystem path (partial), schema: { type: string } }
        - { name: group, in: query, description: Group name, schema: { type: string } }
        - { name: site, in: query, description: Site name, schema: { type: string } }
      responses:
        "200":
          description: Certificates (subject, issuer, path, not_after, days_left, key and signature details)
          content:
            application/json:
              schema:
                type: object
                properties:
                  certs: { type: array, items: { type: object } }

  /search/pki:
    get:
      operationId: searchPki
      summary: Search managed certificates
      description: Certificates ManageLM itself issues and renews (Internal CA and Let's Encrypt).
      parameters:
        - { name: query, in: query, description: "Common name, agent or SAN", schema: { type: string } }
        - { name: status, in: query, description: "active, revoked, expired, failed, pending", schema: { type: string } }
        - { name: source, in: query, description: "local_ca, letsencrypt", schema: { type: string } }
        - { name: agent, in: query, description: Server hostname or display name, schema: { type: string } }
        - { name: site, in: query, description: Site name, schema: { type: string } }
      responses:
        "200":
          description: Managed certificates
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificates: { type: array, items: { type: object } }
                  truncated: { type: boolean }

  /search/monitors:
    get:
      operationId: searchMonitors
      summary: Search monitors
      description: >
        Monitors with their current status (up, down, degraded, pending, or
        stalled when the server is offline), value and unit.
      parameters:
        - { name: query, in: query, description: "Monitor name, server or type", schema: { type: string } }
        - { name: status, in: query, description: "up, down, degraded, pending, stalled", schema: { type: string } }
        - { name: slug, in: query, description: "Monitor type: website, mysql, smtp, cpu, memory, filesystem, process, ...", schema: { type: string } }
        - { name: agent, in: query, description: Server hostname or display name, schema: { type: string } }
        - { name: site, in: query, description: Site name, schema: { type: string } }
      responses:
        "200":
          description: Monitors
          content:
            application/json:
              schema:
                type: object
                properties:
                  monitors: { type: array, items: { type: object } }
                  truncated: { type: boolean }

  /search/backups:
    get:
      operationId: searchBackups
      summary: Search backups
      description: Filesystem backups with status, schedule, snapshot count and last run.
      parameters:
        - { name: query, in: query, description: "Backup name, source path or server", schema: { type: string } }
        - { name: status, in: query, description: "pending, running, ok, failed", schema: { type: string } }
        - { name: agent, in: query, description: Server hostname or display name, schema: { type: string } }
        - { name: site, in: query, description: Site name, schema: { type: string } }
      responses:
        "200":
          description: Backups
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups: { type: array, items: { type: object } }
                  truncated: { type: boolean }

  /search/credentials:
    get:
      operationId: searchCredentials
      summary: Search rotating credentials
      description: >
        Credentials ManageLM rotates: last and next rotation, state, failures.
        Metadata only; secret values can never be retrieved.
      parameters:
        - { name: query, in: query, description: "Name, account, host or connector", schema: { type: string } }
        - { name: state, in: query, description: "active, failed, pending, rotating", schema: { type: string } }
        - { name: type, in: query, description: "Kind or backend (substring): password, ssh_key, ldap, entra, ...", schema: { type: string } }
        - { name: agent, in: query, description: Server hostname or display name, schema: { type: string } }
        - { name: site, in: query, description: Site name, schema: { type: string } }
      responses:
        "200":
          description: Credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials: { type: array, items: { type: object } }
                  truncated: { type: boolean }

  /search/keystore:
    get:
      operationId: searchKeystore
      summary: Search the keystore
      description: >
        KSM Keystore keys, the applications using them, and per-day usage or
        refusals. Metadata only; key material never leaves the keystore.
      parameters:
        - { name: view, in: query, description: "keys (default), clients, denied, activity", schema: { type: string, enum: [keys, clients, denied, activity] } }
        - { name: query, in: query, description: "Key, handle, application, caller or refusal reason", schema: { type: string } }
        - { name: agent, in: query, description: Server hostname or display name, schema: { type: string } }
      responses:
        "200":
          description: Rows for the requested view
          content:
            application/json:
              schema:
                type: object
                properties:
                  view: { type: string }
                  rows: { type: array, items: { type: object } }
                  truncated: { type: boolean }

  /search/connectors:
    get:
      operationId: listConnectors
      summary: List hosting connectors
      description: Hosting connectors (AWS, Azure, GCP, OpenStack, Proxmox, VMware) with sync status and resource counts.
      responses:
        "200":
          description: Connectors
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors: { type: array, items: { type: object } }

  /search/cloud:
    get:
      operationId: searchCloud
      summary: Search cloud resources
      description: >
        VMs, volumes, networks and security groups discovered by hosting
        connectors. Each row carries the id and connector_id runConnectorAction needs.
      parameters:
        - { name: query, in: query, description: "Resource name, provider id or region", schema: { type: string } }
        - { name: type, in: query, description: "vm, volume, network, security_group", schema: { type: string } }
        - { name: status, in: query, description: "Provider-side status (running, stopped, ...)", schema: { type: string } }
        - { name: provider, in: query, description: "aws, azure, gcp, vmware, proxmox, openstack", schema: { type: string } }
        - { name: connector, in: query, description: Connector name, schema: { type: string } }
        - { name: unmatched, in: query, description: Only VMs with no ManageLM agent, schema: { type: boolean } }
      responses:
        "200":
          description: Resources
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources: { type: array, items: { type: object } }
                  truncated: { type: boolean }

  # ── Tasks ────────────────────────────────────────────────────────────

  /tasks:
    post:
      operationId: submitTask
      x-openai-isConsequential: true
      summary: Run a task on a server
      description: >
        Run a natural-language instruction on one server with a skill. Waits up to
        wait_seconds: 200 with the result, or 202 with still_running and the
        task_id to check later with getTask.
      parameters:
        - { name: wait_seconds, in: query, required: true, description: "Always 35", schema: { type: integer, minimum: 1, maximum: 40, default: 35 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, skill_slug, instruction]
              properties:
                agent_id: { type: string, format: uuid, description: Agent id from searchAgents }
                skill_slug:
                  type: string
                  description: 'A skill slug from getAgentSkills (e.g. base, packages, services, users), or "auto" to let the agent choose'
                instruction: { type: string, description: "What to do, in plain language. Be specific." }
      responses:
        "200":
          description: Task finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskOutcome" }
        "202":
          description: Task still running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskOutcome" }
        "400":
          description: Invalid request (e.g. the skill cannot run this kind of task)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: No access to this server, or the skill is not allowed for the user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Server or skill not found, or tasks are disabled for this account (No LLM mode)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Daily request limit reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Server not online
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    get:
      operationId: listTasks
      summary: Task history
      description: Recent tasks, newest first, optionally for one server, a status or a time range.
      parameters:
        - { name: agent_id, in: query, description: Agent id from searchAgents, schema: { type: string, format: uuid } }
        - { name: status, in: query, description: "sent, completed, failed, timeout, needs_input, answered", schema: { type: string } }
        - { name: since, in: query, description: 'ISO-8601 date or datetime (inclusive), e.g. "2026-05-10"', schema: { type: string } }
        - { name: until, in: query, description: ISO-8601 date or datetime (exclusive), schema: { type: string } }
        - { name: limit, in: query, required: true, description: "Max results. Always send it: each task carries its full request and output, and the portal default of 50 is too large for an action response.", schema: { type: integer, default: 10, minimum: 1, maximum: 20 } }
        - { name: offset, in: query, description: Results to skip, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks: { type: array, items: { $ref: "#/components/schemas/Task" } }

  /tasks/{taskId}:
    get:
      operationId: getTask
      summary: Get task status and result
      description: Status, summary, question and result of a task. Use it for a task that was still running.
      parameters:
        - { name: taskId, in: path, required: true, description: Task id, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: "#/components/schemas/Task" }
        "400":
          description: "Not an id: pass the uuid from searchAgents or a task response, not a name"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Task not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{taskId}/answer:
    post:
      operationId: answerTask
      x-openai-isConsequential: true
      summary: Answer a task's question
      description: >
        ONLY for a task in status needs_input: send the user's answer (a domain
        name, password, choice, ...) and resume it. To continue after a completed
        task, use followUpTask.
      parameters:
        - { name: taskId, in: path, required: true, description: Id of the task in needs_input status, schema: { type: string, format: uuid } }
        - { name: wait_seconds, in: query, required: true, description: "Always 35", schema: { type: integer, minimum: 1, maximum: 40, default: 35 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, description: "The user's answer to the agent's question" }
      responses:
        "200":
          description: Resumed task finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskOutcome" }
        "202":
          description: Resumed task still running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskOutcome" }
        "409":
          description: Task is not waiting for input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Conversation context expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{taskId}/follow-up:
    post:
      operationId: followUpTask
      x-openai-isConsequential: true
      summary: Continue a completed task
      description: >
        Continue the conversation of a completed or failed task with a new
        instruction. The agent keeps the context for 5 minutes after the task ends.
      parameters:
        - { name: taskId, in: path, required: true, description: Id of the completed task, schema: { type: string, format: uuid } }
        - { name: wait_seconds, in: query, required: true, description: "Always 35", schema: { type: integer, minimum: 1, maximum: 40, default: 35 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string, description: Follow-up request }
      responses:
        "200":
          description: Follow-up finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskOutcome" }
        "202":
          description: Follow-up still running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskOutcome" }
        "409":
          description: The task has not completed yet (use answerTask for a question)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Conversation context expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{taskId}/changes:
    get:
      operationId: getTaskChanges
      summary: Files changed by a task
      description: Files a task modified, with an optional full unified diff fetched from the server (server must be online).
      parameters:
        - { name: taskId, in: path, required: true, description: Task id, schema: { type: string, format: uuid } }
        - { name: full_diff, in: query, description: Include the full diff, schema: { type: boolean } }
      responses:
        "200":
          description: Changeset
          content:
            application/json:
              schema:
                type: object
                properties:
                  changeset: { type: object }
        "404":
          description: No changes recorded for this task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /tasks/{taskId}/revert:
    post:
      operationId: revertTask
      x-openai-isConsequential: true
      summary: Revert a task's file changes
      description: >
        Undo the file changes of a task (server online, changes under 30 days old).
        Show the changes with getTaskChanges and confirm with the user first. It can
        take up to a minute: if the call fails, check getTaskChanges before retrying.
      parameters:
        - { name: taskId, in: path, required: true, description: Task id to revert, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Revert result
          content:
            application/json:
              schema: { type: object }
        "404":
          description: No changes to revert
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already reverted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Server not online
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── Scans (start, then read the result) ──────────────────────────────

  /{scan}/{agentId}:
    post:
      operationId: startScan
      x-openai-isConsequential: false
      summary: Start a scan on a server
      description: >
        Start a scan on one server. security: security audit; inventory: services,
        packages, containers; sshkeys: SSH keys and sudo rules; certscan:
        certificates; activity: logins, sudo, file changes (last 24 h). Then call getScan.
      parameters:
        - { name: scan, in: path, required: true, description: Scan type, schema: { type: string, enum: [security, inventory, sshkeys, certscan, activity] } }
        - { name: agentId, in: path, required: true, description: Agent id from searchAgents, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Scan started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
        "409":
          description: A scan of this type is already running on the server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Server not online
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    get:
      operationId: getScan
      summary: Latest scan result of a server
      description: >
        The latest scan of this type on a server. The scan is under "audit"
        (security, activity), "inventory" or "scan" (sshkeys, certscan). Status
        pending or running: not finished yet.
      parameters:
        - { name: scan, in: path, required: true, description: Scan type, schema: { type: string, enum: [security, inventory, sshkeys, certscan, activity] } }
        - { name: agentId, in: path, required: true, description: Agent id from searchAgents, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Latest scan, or null when none has run
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit: { $ref: "#/components/schemas/Scan" }
                  inventory: { $ref: "#/components/schemas/Scan" }
                  scan: { $ref: "#/components/schemas/Scan" }

  # ── Hosting ──────────────────────────────────────────────────────────

  /connectors/{connectorId}/actions:
    get:
      operationId: getConnectorActions
      summary: Actions a connector allows
      description: >
        The VM actions a hosting connector allows (id, label, description, risk,
        params). Check the risk before runConnectorAction.
      parameters:
        - { name: connectorId, in: path, required: true, description: connector_id from searchCloud, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Permitted actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  write_mode: { type: string }
                  actions: { type: array, items: { type: object } }
        "404":
          description: Connector not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    post:
      operationId: runConnectorAction
      x-openai-isConsequential: true
      summary: Run an action on a VM
      description: >
        Start, shut down, stop, reboot or snapshot one VM through its hosting
        connector. Name the VM and the action to the user and get an explicit yes
        before calling, especially for disruptive actions.
      parameters:
        - { name: connectorId, in: path, required: true, description: connector_id from searchCloud, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resource_id, action]
              properties:
                resource_id: { type: string, format: uuid, description: The VM's id from searchCloud }
                action: { type: string, description: "Action id from getConnectorActions, e.g. vm.start, vm.shutdown, vm.reboot, vm.snapshot.create" }
                params: { type: object, description: 'Action parameters, e.g. {"name": "before-upgrade"} for a snapshot' }
      responses:
        "200":
          description: Action accepted (pending true while the hypervisor finishes)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detail: { type: string }
                  pending: { type: boolean }
        "400":
          description: Unknown action, or it does not apply to this resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Missing the Hosting permission, write mode disabled, or the action is not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Connector or resource not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── Utility ──────────────────────────────────────────────────────────

  /email:
    post:
      operationId: sendEmail
      x-openai-isConsequential: false
      summary: Email yourself a report
      description: Send a plain-text email to the signed-in user's own address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, body]
              properties:
                subject: { type: string, description: Email subject }
                body: { type: string, description: Plain-text body; blank lines separate paragraphs }
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema: { type: object }
        "429":
          description: Email limit reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
